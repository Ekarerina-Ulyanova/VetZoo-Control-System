<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитические отчеты - VetZoo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Аналитические отчеты</span>
            <div>
                <a href="/" class="btn btn-sm btn-light me-2">На главную</a>
                <a href="/logout" class="btn btn-sm btn-outline-light">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#healthReport">Здоровье животных</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#vaccinationReport">Вакцинация</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="healthReport">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Статусы здоровья животных</h5>
                            </div>
                            <div class="card-body">
                                <canvas id="healthChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Статистика по видам</h5>
                            </div>
                            <div class="card-body">
                                <div id="speciesStats"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="vaccinationReport">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Статистика вакцинации</h5>
                            </div>
                            <div class="card-body">
                                <div id="vaccinationStats"></div>
                                <canvas id="vaccinationChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5>Животные без прививок</h5>
                            </div>
                            <div class="card-body">
                                <div id="animalsWithoutVaccines"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="reports.js"></script>
</body>
</html>
